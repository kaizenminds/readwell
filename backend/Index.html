<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1014;--side:#111318;--panel:#15181d;--raise:#1b1f25;--hover:#1f242b;--sel:#242a33;
  --line:#23272e;--line2:#2e333b;--ink:#eceef2;--ink2:#c3c8d0;--muted:#8b929d;--faint:#5c636e;
  --accent:#f2a93b;--accent2:#ffcf7d;--accent-bg:rgba(242,169,59,.13);--danger:#f06b5d;--danger-bg:rgba(240,107,93,.12);
  --ok:#4cc38a;--blue:#7aa7ff;--blue-bg:rgba(122,167,255,.13);--r:12px;--top:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--accent-bg)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2f37;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.on svg.i.fillable{fill:currentColor}

/* loading bar */
#bar{position:fixed;top:0;left:0;height:2px;width:100%;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#bar.on{opacity:1}
#bar::before{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--accent);animation:slide 1s ease-in-out infinite}
@keyframes slide{to{left:100%}}

/* shell */
.side .nav{padding-top:12px}
.shell{display:flex;height:100%;height:100dvh;padding-top:env(safe-area-inset-top);box-sizing:border-box}
.side{width:224px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0 10px 12px}
.logo{display:flex;align-items:center;gap:10px;height:var(--top);flex:none;margin:0 -10px 10px;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#e07a2c);display:grid;place-items:center;color:#1a1206;flex:none}
.mark svg{width:16px;height:16px;stroke:#1a1206;stroke-width:2.2;fill:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.side-foot button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink2);padding:9px 10px;border-radius:9px;text-align:left;font-weight:500}
.nav button:hover,.side-foot button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--sel);color:var(--ink)}
.nav button.on svg{color:var(--accent)}
.lbl{flex:1}
.cnt{font-size:11px;color:var(--muted);font-weight:600}
.cnt.hot:not(:empty){background:var(--accent);color:#1a1206;border-radius:99px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}

/* list column */
.col-list{width:30%;min-width:270px;max-width:440px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-width:0}
.lbar{height:var(--top);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.lbar h2{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:700;display:flex;align-items:baseline;gap:8px}
.lhead{padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.lbar h2 .sub{font-size:12px;color:var(--muted);font-weight:500}
.lstatus{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:12px;padding:6px 0 6px 8px;white-space:nowrap}
.lstatus svg.i{width:14px;height:14px}
.lstatus.busy{color:var(--accent2)}
.lstatus.busy svg.i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;padding:9px 12px 9px 36px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);outline:none}
.search input:focus{border-color:var(--accent)}
.lctl{display:flex;gap:8px;align-items:center;margin-top:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);padding:4px 11px;border-radius:7px;font-size:12px;font-weight:600}
.seg button.on{background:var(--sel);color:var(--ink)}
.tagrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.tagrow::-webkit-scrollbar{display:none}
.tchip{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:99px;padding:3px 10px;font-size:12px;white-space:nowrap}
.tchip.on{border-color:var(--accent);color:var(--accent2);background:var(--accent-bg)}
#list{flex:1;overflow:auto}
.item{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.item:hover{background:var(--hover)}
.item.sel{background:var(--sel)}
.item.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;letter-spacing:.02em}
.ibody{flex:1;min-width:0}
.irow{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.ifrom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.idate{flex:none}
.isubj{margin-top:2px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.unread .isubj{color:var(--ink);font-weight:600}
.item.unread .ifrom{color:var(--ink2)}
.item.unread .idate{color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;padding:0 8px;border-radius:99px;background:var(--raise);color:var(--muted);line-height:19px;border:1px solid var(--line2)}
.star{color:var(--accent);margin-right:3px}
.empty{color:var(--muted);padding:56px 24px;text-align:center}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:10px}
.empty b{display:block;color:var(--ink2);font-weight:600;margin-bottom:4px}
.more{display:block;margin:14px auto;border:1px solid var(--line2);background:none;color:var(--ink2);padding:7px 16px;border-radius:9px}

/* reader */
.col-read{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#rwrap{display:none;flex:1;flex-direction:column;min-height:0}
body.reading #rwrap{display:flex}
body.reading #noread{display:none}
.rbar{display:flex;align-items:center;gap:4px;height:var(--top);padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:15;transition:transform .2s ease}
#rwrap.bar-up .rbar{transform:translateY(-100%)}
.ib{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--ink2)}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.on{color:var(--accent)}
.ib.danger:hover{color:var(--danger);background:var(--danger-bg)}
.ib .n{position:absolute;top:3px;right:2px;font-size:10px;font-weight:700;color:var(--accent)}
.ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:40;pointer-events:none}
.sep{width:1px;height:20px;background:var(--line2);margin:0 6px}
.grow{flex:1}
.mob{display:none}
.rbody{flex:1;display:flex;min-height:0;position:relative}
#rscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-width:0;background:var(--bg)}
.rmeta{padding:14px 20px 12px;max-width:860px;margin:0 auto}
.rfrom{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.rfrom span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfrom b{color:var(--ink2);font-weight:600}
.rmeta h1{margin:8px 0;font-size:19px;line-height:1.3;letter-spacing:-.02em;font-weight:700}
.tagin{display:flex;align-items:center;gap:6px;color:var(--faint)}
.tagin svg{width:14px;height:14px}
.tagin input{flex:1;max-width:320px;border:0;border-bottom:1px dashed var(--line2);background:none;padding:3px 2px;font-size:12px;outline:none;color:var(--ink2)}
.tagin input:focus{border-bottom-color:var(--accent)}
.paper{position:relative;background:#fff;max-width:860px;margin:0 auto 40px;border-radius:var(--r);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);min-height:60vh}
iframe{width:100%;height:60vh;border:0;display:block;background:#fff}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#8a8f98;background:#fff;font-size:13px}
#side{width:300px;flex:none;border-left:1px solid var(--line);overflow:auto;background:var(--panel);display:none}
body.side-open #side{display:block}
.side-body{padding:14px}
body.list-hidden .col-list{display:none}
.side-h{height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:2}
.hl{background:var(--raise);border:1px solid var(--line);border-left:3px solid #e9c64a;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.hl .t{cursor:pointer;color:var(--ink);font-size:13px;line-height:1.55}
.hl textarea,.hl input{width:100%;margin-top:8px;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:var(--bg);font-size:12px;resize:vertical;outline:none;color:var(--ink2)}
.hl textarea:focus,.hl input:focus{border-color:var(--accent)}
.hl .meta{font-size:11px;color:var(--faint);display:flex;justify-content:space-between;margin-top:6px}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:11px}
.link:hover{color:var(--danger)}
#noread{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:6px}
#noread svg{width:40px;height:40px;color:var(--faint)}

/* menus, modal, toast */
.menu{display:none;position:absolute;right:14px;top:calc(100% + 4px);z-index:45;background:var(--raise);border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:6px;width:300px;max-width:calc(100vw - 28px)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;color:var(--ink)}
.menu button:hover{background:var(--hover)}
.menu small{display:block;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--raise);border:1px solid var(--line2);border-radius:16px;padding:22px;width:400px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 18px;color:var(--ink2);font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--raise);color:var(--ink);padding:7px 14px;border-radius:9px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.on{border-color:var(--accent);color:var(--accent2);background:var(--accent-bg)}
@media (hover:none){.ib[data-tip]:hover::after{display:none}}
/* Reading dock: the everyday actions, floating at the bottom of the newsletter */
.col-read{position:relative}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:none;align-items:center;gap:4px;padding:6px;border-radius:22px;background:rgba(24,27,33,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:0 16px 44px rgba(0,0,0,.55);z-index:30;transition:opacity .2s,transform .2s}
body.reading #dock{display:flex}
body.reading.side-open #dock{left:calc(50% - 150px)}
#dock .ib{width:48px;height:48px;border-radius:15px}
#dock .ib svg.i{width:23px;height:23px}
#dock .dsep{width:1px;height:26px;background:var(--line2);margin:0 2px}
#hlbtn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;margin:0 2px;border-radius:15px;border:0;background:var(--accent-bg);color:var(--accent2);font-weight:600;font-size:15px;transition:background .15s,color .15s}
#hlbtn svg.i{width:21px;height:21px}
#hlbtn.ready{background:var(--accent);color:#1a1206}
#rscroll{padding-bottom:96px}
body.reading #toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.rbtitle{flex:1;min-width:0;text-align:center;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;padding:0 8px}
#rwrap.scrolled .rbtitle{opacity:1}
.rbar .ib{width:44px;height:44px}
.rbar .ib svg.i{width:22px;height:22px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#dock .menu{top:auto;bottom:calc(100% + 10px);right:0;max-height:calc(100vh - 120px);overflow:auto}
#dock{max-width:calc(100% - 16px)}
.menu .mdanger{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#f4f5f7;color:#111;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}

/* wide views: highlights, senders, settings */
.col-wide{flex:1;overflow:auto;display:none;padding:0 0 80px}
.wtop{height:var(--top);display:flex;align-items:center;padding:0 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.wtop h2{margin:0;font-size:17px;letter-spacing:-.02em}
body[data-view=highlights] #listcol,body[data-view=highlights] #reader,
body[data-view=senders] #listcol,body[data-view=senders] #reader,
body[data-view=settings] #listcol,body[data-view=settings] #reader{display:none}
body[data-view=highlights] #hlview,body[data-view=senders] #srcview,body[data-view=settings] #setview{display:block}
.wide{max-width:780px;margin:0 auto;padding:20px 32px 0}
.wide h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
.wide .lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.src{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.src:first-of-type{border-top:0}
.src .who{flex:1;min-width:0}
.src .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .sub{font-size:12px;color:var(--muted)}
.src .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--raise);color:var(--muted);white-space:nowrap;border:1px solid var(--line2)}
.badge.allow{color:var(--ok);border-color:rgba(76,195,138,.3);background:rgba(76,195,138,.1)}
.badge.block{color:var(--danger);border-color:rgba(240,107,93,.3);background:var(--danger-bg)}
.badge.likely{color:var(--blue);border-color:rgba(122,167,255,.3);background:var(--blue-bg)}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);outline:none}
.searchrow input:focus{border-color:var(--accent)}
.group{margin-bottom:26px}
.gtitle{font-weight:600;cursor:pointer;font-size:15px}
.gtitle:hover{color:var(--accent2)}
.gfrom{font-size:12px;color:var(--muted);margin:2px 0 10px}
.setrow{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.switch{width:42px;height:24px;border-radius:99px;border:0;background:var(--line2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:21px}
.preview{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);font-size:13px;display:none}
.preview ul{margin:8px 0 12px;padding-left:18px;color:var(--ink2)}
a{color:var(--accent2)}
a.btn{text-decoration:none;display:inline-block}

/* mobile tab bar */
.tabbar{display:none}
#railbtn,#railscrim{display:none}
.hlpill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);font-weight:600;font-size:13px;margin:0 4px;flex:none}
.hlpill:hover{border-color:var(--accent)}
.ptag{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:#ff8a4c;background:rgba(255,103,25,.12);border:1px solid rgba(255,103,25,.28);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
/* Larger toolbar option (Settings, per device) */

@media (max-width:1180px){
  .side{width:68px;padding:0 8px 12px}
  .side .lbl,.logo span{display:none}
  .logo{padding:0;margin:0 -8px 10px;justify-content:center}
  .nav button,.side-foot button{justify-content:center;padding:10px 0;position:relative}
  .cnt.hot:not(:empty){position:absolute;top:3px;right:6px;font-size:10px;padding:0 5px;line-height:16px}
  .cnt:not(.hot){display:none}
  .side{width:84px;padding:0 6px 12px}
  .nav button,.side-foot button{flex-direction:column;gap:4px;padding:10px 0 8px}
  .nav svg.i,.side-foot svg.i{width:24px;height:24px}
  .side .nav .lbl,.side .side-foot .lbl{display:block;font-size:10.5px;line-height:1.1;font-weight:500;color:var(--muted)}
  .nav button.on .lbl{color:var(--accent)}
  .logo{margin:0 -6px 10px}
  body.rail-open .side{position:fixed;left:0;top:0;bottom:0;width:224px;padding:0 10px 12px;z-index:45;box-shadow:16px 0 40px rgba(0,0,0,.5)}
  body.rail-open .side .lbl,body.rail-open .logo span{display:inline}
  body.rail-open .logo{padding:0 20px;margin:0 -10px 10px;justify-content:flex-start}
  body.rail-open .nav button,body.rail-open .side-foot button{justify-content:flex-start;padding:9px 10px}
  body.rail-open #railbtn i{transform:rotate(180deg)}
  body.rail-open .shell{padding-left:68px}
  body.rail-open #railscrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.35)}
  #side{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-16px 0 40px rgba(0,0,0,.45)}
  .rmeta{max-width:none;background:var(--panel);border-bottom:1px solid var(--line)}
  .paper{border-radius:0;box-shadow:none;max-width:none;margin:0;min-height:calc(100vh - var(--top))}
}
/* short landscape screens (phones on their side): tighter chrome, more reading space */
@media (max-height:540px) and (orientation:landscape){
  .side .nav .lbl,.side .side-foot .lbl{display:none}
  .side .nav{padding-top:6px}
  #dock .dnav,#dock .dsep{display:none}
  #hlbtn span{display:none}
  #hlbtn{padding:0 14px}
  #dock{bottom:calc(10px + env(safe-area-inset-bottom))}
  :root{--top:44px}
  .nav button,.side-foot button{padding:7px 0}
  .lbar h2{font-size:15px}

<script>
/* ---------- Icons ---------- */
const ICON = {
  inbox: '<path d="M4 13l2.4-7h11.2L20 13v6H4z"/><path d="M4 13h4.5l1 2h5l1-2H20"/>',
  bookmark: '<path d="M7 4h10v16l-5-4-5 4z"/>',
  archive: '<rect x="4" y="5" width="16" height="4" rx="1"/><path d="M6 9v10h12V9M10 13h4"/>',
  pen: '<path d="M14.5 4.5l5 5L11 18H6v-5z"/><path d="M4 21h8"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.9-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><path d="M16 5.3a3 3 0 0 1 0 5.4M17.5 14.6c1.6.6 2.6 2.2 3 4.4"/>',
  refresh: '<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  star: '<path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>',
  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/>',
  trash: '<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>',
  dots: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  tag: '<path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8" cy="8" r="1.3"/>',
  book: '<path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/>',
  sparkle: '<path d="M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6z"/>',
  notes: '<path d="M5 5h14M5 10h14M5 15h9M5 20h6"/>',
  up: '<path d="M6 15l6-6 6 6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  chevr: '<path d="M9 6l6 6-6 6"/>',
  panel: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>'
};
// Newsletter platform from the sender's address (Substack, Beehiiv and similar), shown as a small tag
const PLAT = [[/(^|[@.])substack\.com$/i, 'Substack'], [/beehiiv\.com$/i, 'Beehiiv'], [/ghost\.io$/i, 'Ghost'], [/(convertkit|kit)\.com$|ck\.page$/i, 'Kit'], [/buttondown\.email$|buttondown\.com$/i, 'Buttondown']];
const platformOf = e => { e = String(e || ''); for (let k = 0; k < PLAT.length; k++) if (PLAT[k][0].test(e)) return PLAT[k][1]; return ''; };
const ptag = e => { const k = String(e || '').toLowerCase(), r = S.senders && S.senders[k]; const p = (r && r.platform) || platformOf(k); return p ? '<span class="ptag">' + esc(p) + '</span>' : ''; };
const ico = (n, fill) => '<svg class="i' + (fill ? ' fillable' : '') + '" viewBox="0 0 24 24">' + (ICON[n] || '') + '</svg>';
function paintIcons(root) {
  (root || document).querySelectorAll('i[data-i]').forEach(el => { el.outerHTML = ico(el.dataset.i, el.hasAttribute('data-fill')); });
}
paintIcons();

/* ---------- State ---------- */
const S = {
  view: 'inbox', mode: '', tagFilter: '', start: 0, items: [], more: false, cur: null,
  tags: {}, hls: {}, allHl: [], senders: {}, bodies: {}, settings: null,
  sendersData: null, pending: 0, pendingSenders: 0
};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const MOBILE_Q = window.matchMedia('(max-width:599px)');
const TABLET_PORTRAIT_Q = window.matchMedia('(min-width:600px) and (max-width:1100px) and (orientation:portrait)');
const isTabletPortrait = () => TABLET_PORTRAIT_Q.matches;
const isMobile = () => MOBILE_Q.matches;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
const splitTags = s => String(s || '').split(',').map(t => t.trim()).filter(Boolean);
const chips = tags => splitTags(tags).map(t => '<span class="chip">' + esc(t) + '</span>').join('');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function avatar(name, size) {
  const s = String(name || '?');
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  const ini = s.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || s[0].toUpperCase();
  return '<div class="av" style="background:hsl(' + h + ' 32% 22%);color:hsl(' + h + ' 70% 78%)' + (size ? ';width:' + size + 'px;height:' + size + 'px;border-radius:8px;font-size:10px' : '') + '">' + esc(ini) + '</div>';
}

/* ---------- Server calls ---------- */
// run(): waits, shows the loading bar. bg(): fire and forget, the screen is already updated.
function run(fn, ...args) { return call(true, fn, args); }
function quiet(fn, ...args) { return call(false, fn, args); }
function call(showBar, fn, args) {
  if (showBar) { S.pending++; $('#bar').classList.add('on'); }
  return new Promise((res, rej) => {
    const done = () => { if (showBar && --S.pending <= 0) { S.pending = 0; $('#bar').classList.remove('on'); } };
    google.script.run
      .withSuccessHandler(r => { done(); res(r); })
      .withFailureHandler(e => { done(); toast('Something went wrong: ' + ((e && e.message) || e)); rej(e); })[fn](...args);
  });
}
function bg(fn, ...args) { saveStateSoon(); return quiet(fn, ...args).catch(() => null); }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800);
}

function confirmBox(title, body, okLabel) {
  return new Promise(res => {
    $('#mtitle').textContent = title; $('#mbody').textContent = body; $('#mok').textContent = okLabel || 'Delete';
    $('#modal').classList.add('open');
    const close = v => { $('#modal').classList.remove('open'); res(v); };
    $('#mok').onclick = () => close(true);
    $('#mcancel').onclick = () => close(false);
    $('#modal').onclick = e => { if (e.target.id === 'modal') close(false); };
  });
}

/* ---------- Browser cache (instant startup) ---------- */
function cacheGet(k) { try { return JSON.parse(localStorage.getItem('nr_' + k) || 'null'); } catch (e) { return null; } }
function cacheSet(k, v) { try { localStorage.setItem('nr_' + k, JSON.stringify(v)); } catch (e) {} }
function saveState() {
  cacheSet('state', { tags: S.tags, senders: S.senders, pending: S.pendingSenders || 0, settings: S.settings,
    highlights: S.allHl.filter(h => String(h.id).indexOf('tmp') !== 0).map(h => ({ id: h.id, messageId: h.messageId,
      subject: h.subject, sender: h.sender, text: h.text, note: h.note, tags: h.tags, createdAt: h.createdAt })) });
}
let saveTimer;
function saveStateSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 300); }
// Last 15 opened issues stay in this browser, so reopening them is instant
function bodyGet(id) { return cacheGet('b_' + id); }
function bodyDrop(id) { try { localStorage.removeItem('nr_b_' + id); } catch (e) {} }
function bodyPut(id, b) {
  const idx = (cacheGet('bidx') || []).filter(x => x !== id);
  idx.push(id);
  while (idx.length > 15) bodyDrop(idx.shift());
  for (let tries = 0; tries < 5; tries++) {
    try { localStorage.setItem('nr_b_' + id, JSON.stringify(b)); break; }
    catch (e) { const old = idx.shift(); if (!old || old === id) break; bodyDrop(old); }
  }
  cacheSet('bidx', idx);
}

/* ---------- State helpers ---------- */
function applyState(st) {
  S.tags = st.tags || {};
  S.senders = st.senders || {};
  // Keep highlights made on this device that the server copy doesn't have yet
  const server = st.highlights || [], same = (a, b) => a.messageId === b.messageId && squash(a.text) === squash(b.text);
  const local = (S.allHl || []).filter(h => (String(h.id).indexOf('tmp') === 0 || Date.now() - (h.createdAt || 0) < 120000) && !server.some(x => x.id === h.id || same(x, h)));
  S.allHl = local.concat(server);
  if (st.settings) S.settings = st.settings;
  S.hls = {};
  S.allHl.forEach(h => (S.hls[h.messageId] = S.hls[h.messageId] || []).push(h));
  setPending(st.pending || 0);
  renderTagRow(); paintCounts();
}
function setPending(n) {
  S.pendingSenders = Math.max(0, n);
  $$('.pendn').forEach(el => el.textContent = S.pendingSenders || '');
  saveStateSoon();
}
function paintCounts() {
  if (S.view === 'inbox' && !S.mode) {
    const u = S.items.filter(i => i.unread).length;
    $('#cnt-inbox').textContent = u || '';
    $('#vsub').textContent = u ? u + ' unread' : '';
  } else $('#vsub').textContent = '';
  $('#cnt-hl').textContent = S.allHl.length || '';
}
function mergeItems(items) {
  const have = {}; S.items.forEach(x => have[x.id] = 1);
  items.forEach(x => { if (!have[x.id]) S.items.push(x); });
  S.items.sort((a, b) => b.date - a.date);
  if (S.view === 'inbox') cacheSet('inbox', S.items);
}
const isFav = email => !!(S.senders[email] && S.senders[email].fav);
const favList = () => Object.keys(S.senders).filter(k => S.senders[k].fav && k.indexOf('@') > 0);
function allTagNames() {
  const set = {};
  Object.values(S.tags).forEach(t => splitTags(t).forEach(x => set[x] = 1));
  S.allHl.forEach(h => splitTags(h.tags).forEach(x => set[x] = 1));
  return Object.keys(set).sort();
}
function renderTagRow() {
  const tags = allTagNames();
  if (S.tagFilter && !tags.includes(S.tagFilter)) S.tagFilter = '';
  $('#tagrow').innerHTML = tags.length ? ['<button class="tchip' + (S.tagFilter ? '' : ' on') + '" data-t="">All tags</button>']
    .concat(tags.map(t => '<button class="tchip' + (S.tagFilter === t ? ' on' : '') + '" data-t="' + esc(t) + '">#' + esc(t) + '</button>')).join('') : '';
  $$('#tagrow .tchip').forEach(b => b.onclick = () => { S.tagFilter = b.dataset.t; renderTagRow(); renderList(); });
}

/* ---------- Views ---------- */
const TITLES = { inbox: 'Inbox', saved: 'Saved', archive: 'Archive' };
const isList = () => ['inbox', 'saved', 'archive'].includes(S.view);
$$('[data-v]').forEach(b => b.onclick = () => {
  const v = b.dataset.v, wasOpen = document.body.classList.contains('list-open');
  document.body.classList.remove('rail-open', 'list-open');
  // On an upright tablet, picking Inbox, Saved or Archive while reading slides that list in to browse
  if (isTabletPortrait() && document.body.classList.contains('reading') && ['inbox', 'saved', 'archive'].indexOf(v) >= 0) {
    if (wasOpen && S.view === v) return;            // second tap closes it
    if (S.view !== v) {                               // switch list without closing the newsletter
      S.view = v; document.body.dataset.view = v;
      $$('[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === v));
      $('#vtitle').textContent = TITLES[v]; loadList(true);
    }
    document.body.classList.add('list-open');

/* ---------- Checking for new issues ----------

const lastCheck = () => { try { return Number(localStorage.getItem('nr_lastcheck') || 0); } catch (e) { return 0; } };
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const d = new Date(t), today = new Date().toDateString() === d.toDateString();
  return (today ? '' : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ') + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

  b.title = 'Check now';

async function checkMail(auto) {
  if (S.checking) return;

  $$('.scanbtn').forEach(b => b.disabled = true);
  try {
    const r = await quiet('scanNow');
    try { localStorage.setItem('nr_lastcheck', String(Date.now())); } catch (e) {}
    const parts = [];
    if (r.filed) parts.push(plural(r.filed, 'new newsletter'));
    if (r.found) parts.push(plural(r.found, 'new sender') + ' to review');
    if (parts.length) toast(parts.join(' and '));
    else if (!auto) toast('All caught up. Nothing new since the last check');

function setupFrame() {
  const doc = frame.contentDocument;
  if (!doc || !doc.body || !S.cur || doc.body.dataset.nrid !== S.cur.id || doc.__nr) return;
  doc.__nr = true;
  (S.hls[S.cur.id] || []).forEach(h => markSaved(doc, h));
  fitFrame(doc);
  try { new ResizeObserver(() => fitFrame(doc)).observe(doc.body); } catch (e) {}
  doc.querySelectorAll('img').forEach(im => im.addEventListener('load', () => fitFrame(doc)));

  doc.querySelectorAll('a[href]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  doc.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (a) {
      e.preventDefault();
      if (doc.getSelection().toString().trim()) return;
      const href = a.getAttribute('href') || '';
      if (/^(https?:|mailto:)/i.test(href)) window.open(href, '_blank', 'noopener');
      return;
    }
    const mk = e.target.closest && e.target.closest('mark.nr-hl');
    if (mk) {
      document.body.classList.add('side-open');
      const el = document.getElementById('h-' + mk.dataset.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, true);
  let timer;
  const check = () => {
    clearTimeout(timer);
    timer = setTimeout(() => readSel(doc), 120);
  };
  doc.addEventListener('selectionchange', check);
  doc.addEventListener('mouseup', check);
  doc.addEventListener('touchend', check);
  // iPad and iPhone don't always report selections made inside the newsletter, so also look every half second

}
// Remembers the last selection for a few seconds, because tapping a button can clear it on touch screens
function readSel(doc) {
  const sel = doc.getSelection(), t = sel && sel.rangeCount ? sel.toString().trim() : '';
  if (t.length > 2) S.lastSel = { doc: doc, range: sel.getRangeAt(0).cloneRange(), text: t, at: Date.now() };
  const live = t.length > 2 || !!(S.lastSel && S.lastSel.doc === doc && Date.now() - S.lastSel.at < 2500);
  $('#hlbtn').classList.toggle('ready', live);

function hideBtn() { $('#hlbtn').classList.remove('ready'); }
// The newsletter grows to its full height so the whole reader scrolls as one page
function fitFrame(doc) {

  const h = Math.ceil(Math.max(doc.body.getBoundingClientRect().bottom, doc.body.scrollHeight)) + 8;
  if (Math.abs(frame.offsetHeight - h) > 4) frame.style.height = h + 'px';
}
function scrollToMark(mk) {

  sc.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });

// Toolbar slides away while reading down, comes back on the way up

/* ---------- Highlighting ---------- */
// Map of every non-space character in the email to its text node + offset.
// Matching ignores whitespace, so highlights survive line breaks, links and styling.
function textMap(doc) {
  const w = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
  const map = []; let s = '', n;
  while ((n = w.nextNode())) {
    const p = n.parentNode && n.parentNode.nodeName;
    if (p === 'STYLE' || p === 'SCRIPT' || p === 'TITLE') continue;
    const t = n.nodeValue;
    for (let i = 0; i < t.length; i++) if (!/\s/.test(t[i])) { s += t[i]; map.push([n, i]); }
  }
  return { s: s, map: map };
}
const squash = t => String(t).replace(/\s+/g, '');

function wrapSpan(doc, map, i, j, id) {
  const segs = [];
  for (let k = i; k <= j; k++) {
    const [n, o] = map[k], last = segs[segs.length - 1];
    if (last && last.n === n) last.e = o + 1; else segs.push({ n: n, s: o, e: o + 1 });
  }
  segs.forEach(g => {
    let node = g.n;
    if (g.e < node.nodeValue.length) node.splitText(g.e);
    if (g.s > 0) node = node.splitText(g.s);
    const mk = doc.createElement('mark'); mk.className = 'nr-hl'; mk.dataset.id = id;
    node.parentNode.insertBefore(mk, node); mk.appendChild(node);
  });
  return segs.length > 0;
}

function markSaved(doc, h) {
  const q = squash(h.text); if (!q) return false;
  // Already painted (for example under a temporary id while it was saving)
  const byId = {};
  doc.querySelectorAll('mark.nr-hl').forEach(m => { byId[m.dataset.id] = (byId[m.dataset.id] || '') + m.textContent; });
  if (Object.keys(byId).some(id => squash(byId[id]) === q)) return false;
  const tm = textMap(doc);
  const i = tm.s.indexOf(q); if (i < 0) return false;
  return wrapSpan(doc, tm.map, i, i + q.length - 1, h.id);
}

function unmark(doc, id) {
  doc.querySelectorAll('mark.nr-hl[data-id="' + id + '"]').forEach(mk => {
    while (mk.firstChild) mk.parentNode.insertBefore(mk.firstChild, mk);
    mk.remove();
  });
  doc.body.normalize();
}

// Keep the newsletter's selection when a highlight button is pressed
['#hlbtn'].forEach(id => { const b = $(id); b.addEventListener('pointerdown', e => e.preventDefault()); b.addEventListener('mousedown', e => e.preventDefault()); });
$('#hlbtn').onclick = () => doHighlight(true);
function doHighlight(fromTool) {
  if (Date.now() - (S.hlAt || 0) < 900) return;   // one tap, one highlight
  S.hlAt = Date.now();
  const doc = frame.contentDocument, sel = doc && doc.getSelection();
  hideBtn();
  if (!S.cur || !doc) return;
  let r = null, text = '';
  if (sel && sel.rangeCount && sel.toString().trim().length > 2) { r = sel.getRangeAt(0); text = sel.toString(); }
  else if (S.lastSel && S.lastSel.doc === doc && Date.now() - S.lastSel.at < 8000) { r = S.lastSel.range; text = S.lastSel.text; }
  S.lastSel = null;
  text = String(text).replace(/\s+/g, ' ').trim();
  if (!r || text.length < 3) { if (fromTool) toast('Select some text in the newsletter, then tap the pen'); return; }
  const tm = textMap(doc);
  let i = -1, j = -1;
  for (let k = 0; k < tm.map.length; k++) {
    const [n, o] = tm.map[k];
    let inside = false;
    try { inside = r.comparePoint(n, o) === 0 && r.comparePoint(n, o + 1) === 0; } catch (e) {}
    if (inside) { if (i < 0) i = k; j = k; } else if (i >= 0) break;
  }
  if (i < 0) { toast('Could not highlight that selection'); return; }
  const tmp = 'tmp' + Date.now();
  wrapSpan(doc, tm.map, i, j, tmp);
  sel.removeAllRanges();
  const h = { id: tmp, messageId: S.cur.id, subject: S.cur.subject, sender: S.cur.from, text: text, note: '', tags: '', createdAt: Date.now() };
  (S.hls[h.messageId] = S.hls[h.messageId] || []).unshift(h);
  S.allHl.unshift(h);
  if (!isMobile() && !isTabletPortrait()) document.body.classList.add('side-open'); else toast('Highlighted. Find it under Highlights');
  renderSide(); paintCounts();
  h.ready = quiet('addHighlight', h).then(id => {
    doc.querySelectorAll('mark[data-id="' + tmp + '"]').forEach(m => m.dataset.id = id);
    const card = document.getElementById('h-' + tmp); if (card) { card.id = 'h-' + id; card.dataset.id = id; }
    h.id = id; saveStateSoon(); return id;
  }).catch(() => {
    unmark(doc, tmp);
    S.hls[h.messageId] = (S.hls[h.messageId] || []).filter(x => x !== h);
    S.allHl = S.allHl.filter(x => x !== h);
    renderSide(); paintCounts();
  });
};

function hlCard(h) {

function bindCards(container, inReader) {
  container.querySelectorAll('.hl').forEach(el => {
    const h = S.allHl.find(x => x.id === el.dataset.id); if (!h) return;
    const save = async () => {
      const note = el.querySelector('.note').value;
      const tags = splitTags(el.querySelector('.htags').value.toLowerCase()).join(', ');
      if (note === h.note && tags === h.tags) return;
      h.note = note; h.tags = tags; el.querySelector('.htags').value = tags;
      renderTagRow(); toast('Saved');
      const id = h.ready ? await h.ready : h.id;
      if (id) bg('updateHighlight', id, note, tags);
    };
    el.querySelector('.note').onblur = save;
    el.querySelector('.htags').onchange = save;
    el.querySelector('.del').onclick = async () => {
      S.allHl = S.allHl.filter(x => x !== h);
      S.hls[h.messageId] = (S.hls[h.messageId] || []).filter(x => x !== h);
      if (inReader) { unmark(frame.contentDocument, h.id); renderSide(); } else renderHlView();
      paintCounts(); toast('Highlight deleted');
      const id = h.ready ? await h.ready : h.id;
      if (id) bg('deleteHighlight', id);
    };
    if (inReader) el.querySelector('.t').onclick = () => {
      const mk = frame.contentDocument.querySelector('mark[data-id="' + h.id + '"]');
      if (mk) scrollToMark(mk);
    };
  });
}

  paintToggles(); toast(m.saved ? 'Saved' : 'Removed from Saved');
  if (S.view === 'saved' && !m.saved) { S.items = S.items.filter(x => x.id !== m.id); renderList(); }
  bg('setSaved', m.id, m.saved);
};

$('#favbtn').onclick = () => {
  const m = S.cur; if (!m || !m.email) return;
  const on = !isFav(m.email);
  S.senders[m.email] = Object.assign({}, S.senders[m.email] || { rule: '' }, { fav: on });
  if (on && !S.senders[m.email].rule) S.senders[m.email].rule = 'allow';
  paintToggles(); renderList();
  toast(on ? m.from + ' is a favourite' : 'Removed from favourites');
  bg('setFav', m.email, on, m.from);
};

function dropItems(pred) {
  S.items.filter(pred).forEach(x => { delete S.bodies[x.id]; bodyDrop(x.id); });
  S.items = S.items.filter(x => !pred(x));
  cacheSet('inbox', null);
}

$('#unreadbtn').onclick = () => {
  const m = S.cur; if (!m) return;
  const it = S.items.find(x => x.id === m.id); if (it) it.unread = true;
  closeReader(); toast('Marked unread');
  bg('setUnread', m.id, true);
};

$('#arch').onclick = () => {
  const m = S.cur; if (!m) return;
  const on = !m.archived;
  dropItems(x => x.id === m.id);
  closeReader(); toast(on ? 'Archived' : 'Moved back to Inbox');
  bg('setArchived', m.id, on);
};

$('#delbtn').onclick = async () => {
  const m = S.cur; if (!m) return;
  const ok = await confirmBox('Delete forever?', 'This permanently deletes the email from Gmail. It does not go to Trash and cannot be recovered.', 'Delete forever');
  if (!ok) return;
  const hs = S.hls[m.id] || [];
  if (hs.length) { S.allHl = S.allHl.filter(h => h.messageId !== m.id); delete S.hls[m.id]; }
  delete S.tags[m.id];
  dropItems(x => x.id === m.id);
  closeReader(); paintCounts(); toast('Deleted');
  bg('deleteMessage', m.id);
};

['#unreadbtn', '#delbtn'].forEach(id => $(id).addEventListener('click', () => $('#nlmenu').classList.remove('open')));
// Newer / older issue in the current list
function stepMsg(d) {
  const i = S.items.findIndex(x => S.cur && x.id === S.cur.id), n = i < 0 ? null : S.items[i + d];
  if (n) openMsg(n.id); else toast(d > 0 ? 'That was the last one in this list' : 'This is the newest one');
}
$('#prevbtn').onclick = () => stepMsg(-1);
$('#nextbtn').onclick = () => stepMsg(1);
$('#morebtn').onclick = e => { e.stopPropagation(); $('#nlmenu').classList.toggle('open'); };
document.addEventListener('click', e => { if (!e.target.closest('#nlmenu') && !e.target.closest('#morebtn')) $('#nlmenu').classList.remove('open'); });

const domainOf = email => (String(email).split('@')[1] || '');
function rootDomain(d) {
  const p = d.split('.'); if (p.length <= 2) return d;
  const two = p[p.length - 1].length === 2 && /^(co|com|net|org|gov|ac|edu)$/.test(p[p.length - 2]);
  return p.slice(two ? -3 : -2).join('.');
}
const SHARED = /(^|\.)(gmail|googlemail|yahoo|outlook|hotmail|live|icloud|me|proton|protonmail|rediffmail|substack|beehiiv|ghost|buttondown|mailerlite|convertkit|kit)\.[a-z.]+$/i;

$$('#nlmenu button[data-nl]').forEach(b => b.onclick = () => {
  const m = S.cur; if (!m) return;
  $('#nlmenu').classList.remove('open');
  const kind = b.dataset.nl;
  if (kind === 'one') {
    dropItems(x => x.id === m.id);
    toast('Sent back to your inbox');
    bg('unfileOne', m.id);
  } else if (kind === 'block') {
    dropItems(x => x.email === m.email);
    S.senders[m.email] = { fav: false, rule: 'block' };
    toast(m.from + ' blocked. Their mail is back in your inbox');
    bg('notNewsletter', m.id);
  } else {
    const d = domainOf(m.email);
    const scope = SHARED.test(d) ? m.email : rootDomain(d);
    dropItems(x => x.email === m.email || (scope !== m.email && (x.email.endsWith('@' + scope) || x.email.endsWith('.' + scope))));
    S.senders[m.email] = { fav: false, rule: 'block' };
    toast('Removed ' + scope);
    bg('removeSender', m.email, m.from);
  }
  S.sendersData = null;
  closeReader();
});

/* ---------- Senders ---------- */
const sAct = (a, e, n, label, cls) =>
  '<button class="btn sm ' + (cls || '') + '" data-a="' + a + '" data-e="' + esc(e) + '" data-n="' + esc(n || '') + '">' + label + '</button>';

async function loadSenders(force) {
  if (!S.sendersData || force) {
    if (!S.sendersData) $('#srcview').innerHTML = '<div class="wtop"><h2>Senders</h2></div><div class="wide"><div class="empty">Loading…</div></div>';
    try { S.sendersData = await run('getSenders'); } catch (e) { return; }
  }
  if (S.view === 'senders') renderSenders();
}

function senderRow(x) {
  const blocked = x.rule === 'block', domain = x.key.charAt(0) === '@';
  const badge = blocked ? '<span class="badge block">' + (domain ? 'Domain removed' : 'Removed') + '</span>'
    : x.rule === 'allow' ? '<span class="badge allow">Added</span>' : '';
  const meta = x.count ? plural(x.count, 'issue') + (x.lastDate ? ' · last ' + fmtDate(x.lastDate) : '') : esc(x.key);
  const acts = blocked ? sAct('unblock', x.key, x.name, 'Undo')
    : (domain ? '' : sAct(x.fav ? 'unfav' : 'fav', x.key, x.name, x.fav ? '★ Favourite' : '☆ Favourite', x.fav ? 'on' : '') +
       sAct('remove', x.key, x.name, 'Remove'));
  return '<div class="src">' + avatar(x.name || x.key) + '<div class="who"><div>' + (x.fav ? '<span class="star">★</span>' : '') + esc(x.name || x.key) + ptag(x.key) +
    '</div><div class="sub">' + meta + '</div></div>' + badge + '<div class="acts">' + acts + '</div></div>';
}

function renderSenders() {
  const d = S.sendersData, q = $('#missq') ? $('#missq').value : '', res = $('#missres') ? $('#missres').innerHTML : '';
  const cand = d.candidates.map(c =>
    '<div class="src">' + avatar(c.name) + '<div class="who"><div>' + esc(c.name) + ' <span class="sub">' + esc(c.email) + '</span></div>' +
    '<div class="sub">' + esc(c.subject) + ' · ' + fmtDate(c.date) + (c.count > 1 ? ' · ' + plural(c.count, 'email') : '') + '</div></div>' +
    (c.kind === 'platform' ? '<span class="badge likely">' + esc(c.platform || 'Newsletter') + '</span>' : c.kind === 'likely' ? '<span class="badge likely">Likely newsletter</span>' : '') +
    '<div class="acts">' + sAct('allow', c.email, c.name, 'Add', 'primary') + sAct('ignore', c.email, c.name, 'Ignore') + '</div></div>').join('');
  const plat = {};
  d.candidates.forEach(c => { if (c.kind === 'platform') (plat[c.platform || 'Newsletter'] = plat[c.platform || 'Newsletter'] || []).push(c); });
  const bulk = Object.keys(plat).filter(k => plat[k].length > 1).sort((a, b) => plat[b].length - plat[a].length)
    .map(k => '<button class="btn primary bulkadd" data-p="' + esc(k) + '">Add all ' + esc(k) + ' (' + plat[k].length + ')</button>').join('');
  const added = d.senders.filter(x => x.rule !== 'block'), removed = d.senders.filter(x => x.rule === 'block');
  $('#srcview').innerHTML = '<div class="wtop"><h2>Senders</h2></div><div class="wide"><p class="lead">Decide who makes it into your reader. Everything here takes effect immediately.</p>' +
    '<div class="card"><h4>New senders to review' + (d.candidates.length ? ' <span class="badge">' + d.candidates.length + '</span>' : '') + '</h4>' +
      '<p class="hint">Found by the daily scan. Add pulls in their last 5 days now, and every new issue after that. Ignore means they are never suggested again.</p>' +
      (bulk ? '<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin:0 0 14px">' + bulk + '</div>' : '') +
      (cand || '<div class="sub" style="color:var(--muted)">Nothing to review. Check now finds new ones.</div>') + '</div>' +
    '<div class="card"><h4>Find a newsletter</h4><p class="hint">Search the last 6 months of your mail for anything not in the reader yet. Try a name, a domain, or from:ft.com.</p>' +
      '<form class="searchrow" id="missform"><input id="missq" placeholder="e.g. stratechery, morning brew, from:ft.com"><button class="btn primary">Search</button></form>' +
      '<div id="missres" style="margin-top:8px"></div></div>' +
    '<div class="card"><h4>Your senders <span class="badge">' + added.length + '</span></h4>' +
      '<p class="hint">Remove stops a sender and its whole company domain, so news.brand.com and offers.brand.com go too. Shared domains like Gmail or Substack only lose that one address.</p>' +
      (added.map(senderRow).join('') || '<div class="sub" style="color:var(--muted)">No senders yet.</div>') + '</div>' +
    (removed.length ? '<div class="card"><h4>Removed and ignored <span class="badge">' + removed.length + '</span></h4>' + removed.map(senderRow).join('') + '</div>' : '') +
    '</div>';
  $('#missq').value = q; $('#missres').innerHTML = res;
  $('#missform').onsubmit = e => { e.preventDefault(); searchMissed(); };
  bindSenderActs($('#srcview'));
  $$('#srcview .bulkadd').forEach(b => b.onclick = () => addPlatform(b.dataset.p, plat[b.dataset.p]));
}

// Adds every sender from one newsletter platform in one go
async function addPlatform(name, list) {
  if (!list || !list.length) return;
  const ok = await confirmBox('Add all ' + name + ' senders?', 'Adds ' + plural(list.length, 'sender') + ' and pulls in their last 5 days. You can remove any of them later.', 'Add all');
  if (!ok) return;
  const d = S.sendersData, emails = list.map(c => c.email);
  d.candidates = d.candidates.filter(c => emails.indexOf(c.email) < 0);
  setPending(Math.max(0, S.pendingSenders - list.length));
  list.forEach(c => { upsertSender(c.email, c.name, { rule: 'allow' }); S.senders[c.email] = { fav: false, rule: 'allow' }; });
  renderSenders();
  toast('Adding ' + plural(list.length, name + ' sender') + '. This can take a minute…');
  quiet('allowSenders', list.map(c => ({ email: c.email, name: c.name }))).then(r => {
    mergeItems(r.items);
    if (isList()) renderList(); else if (S.view === 'senders') renderSenders();
    toast(plural(r.count, 'newsletter') + ' from ' + name + ' added to your Inbox');
  }).catch(() => {});
}

function upsertSender(key, name, patch) {
  let s = S.sendersData.senders.find(x => x.key === key);
  if (!s) { s = { key: key, name: name, rule: '', fav: false, count: 0, lastDate: 0 }; S.sendersData.senders.push(s); }
  Object.assign(s, patch);
}

function bindSenderActs(root) {
  root.querySelectorAll('button[data-a]').forEach(b => b.onclick = () => {
    const e = b.dataset.e, n = b.dataset.n, a = b.dataset.a, d = S.sendersData;
    const dropCand = () => {
      const before = d.candidates.length;
      d.candidates = d.candidates.filter(c => c.email !== e);
      if (d.candidates.length < before) setPending(S.pendingSenders - 1);
    };
    if (a === 'allow') {
      dropCand(); upsertSender(e, n, { rule: 'allow' });
      S.senders[e] = { fav: false, rule: 'allow' };
      toast('Added ' + n + '. Pulling in their last 5 days…');
      quiet('allowSender', e, n).then(r => {
        mergeItems(r.items);
        upsertSender(e, n, { count: r.count });
        if (isList()) renderList(); else if (S.view === 'senders') renderSenders();
        toast(r.count ? n + ': ' + plural(r.count, 'newsletter') + ' added to your Inbox' : n + ' added. New issues arrive with the daily scan.');
      }).catch(() => {});
    } else if (a === 'ignore') {
      dropCand(); upsertSender(e, n, { rule: 'block' });
      S.senders[e] = { fav: false, rule: 'block' };
      toast('Ignored ' + n);
      bg('ignoreSender', e, n);
    } else if (a === 'fav' || a === 'unfav') {
      const on = a === 'fav';
      upsertSender(e, n, on ? { fav: true, rule: 'allow' } : { fav: false });
      S.senders[e] = Object.assign({}, S.senders[e] || {}, { fav: on, rule: on ? 'allow' : (S.senders[e] || {}).rule || '' });
      toast(on ? 'Added to favourites' : 'Removed from favourites');
      bg('setFav', e, on, n);
    } else if (a === 'remove') {
      const dm = domainOf(e), scope = SHARED.test(dm) ? e : rootDomain(dm);
      upsertSender(e, n, { rule: 'block', fav: false });
      if (scope !== e) upsertSender('@' + scope, n, { rule: 'block' });
      S.senders[e] = { fav: false, rule: 'block' };
      dropItems(x => x.email === e || (scope !== e && (x.email.endsWith('@' + scope) || x.email.endsWith('.' + scope))));
      toast('Removed ' + scope);
      bg('removeSender', e, n);
    } else if (a === 'unblock') {
      if (e.charAt(0) === '@') d.senders = d.senders.filter(x => x.key !== e);
      else upsertSender(e, n, { rule: '' });
      if (S.senders[e]) S.senders[e].rule = '';
      toast('Undone');
      bg('unblock', e);
    } else if (a === 'one') {
      b.textContent = 'Added'; b.disabled = true;
      toast('Added to your Inbox');
      bg('fileOne', e);
      return;
    }
    renderSenders();
  });
}

async function searchMissed() {
  const q = $('#missq').value.trim(); if (!q) return;
  $('#missres').innerHTML = '<div class="sub" style="color:var(--muted)">Searching…</div>';
  let res;
  try { res = await run('findMissed', q); } catch (e) { $('#missres').innerHTML = ''; return; }
  $('#missres').innerHTML = res.length ? res.map(m =>
    '<div class="src">' + avatar(m.from) + '<div class="who"><div>' + esc(m.from) + ' <span class="sub">' + esc(m.email) + '</span></div>' +
    '<div class="sub">' + esc(m.subject) + ' · ' + fmtDate(m.date) + (m.bulk ? '' : ' · looks like personal mail') + '</div></div>' +
    '<div class="acts">' + sAct('one', m.id, m.from, 'Add this one') + sAct('allow', m.email, m.from, 'Add sender', 'primary') + '</div></div>').join('')
    : '<div class="sub" style="color:var(--muted)">Nothing found outside the reader.</div>';
  bindSenderActs($('#missres'));
}

/* ---------- Highlights view (no server call) ---------- */
function renderHlView() {
  const q = $('#q').value.trim().toLowerCase(), tf = S.tagFilter;
  const list = S.allHl.filter(h =>
    (!tf || splitTags(h.tags).includes(tf)) &&
    (!q || (h.text + ' ' + h.note + ' ' + h.subject + ' ' + h.sender).toLowerCase().includes(q)));
  let body;
  if (!list.length) body = '<div class="empty">' + ico('pen') + '<b>No highlights yet</b>Select text in any newsletter and tap Highlight.</div>';
  else {
    const groups = {}, order = [];
    list.forEach(h => { if (!groups[h.messageId]) { groups[h.messageId] = []; order.push(h.messageId); } groups[h.messageId].push(h); });
    body = order.map(mid => {
      const g = groups[mid];
      return '<div class="group"><div class="gtitle" data-mid="' + esc(mid) + '">' + esc(g[0].subject) + '</div>' +
        '<div class="gfrom">' + esc(g[0].sender) + ' · ' + plural(g.length, 'highlight') + '</div>' + g.map(hlCard).join('') + '</div>';
    }).join('');
  }
  $('#hlview').innerHTML = '<div class="wtop"><h2>Highlights</h2></div><div class="wide"><p class="lead">' + plural(S.allHl.length, 'highlight') + ' across your reading.' + (tf ? ' Showing #' + esc(tf) + '.' : '') + '</p>' + body + '</div>';
  bindCards($('#hlview'), false);
  $$('#hlview .gtitle').forEach(el => el.onclick = () => {
    const mid = el.dataset.mid, g = S.allHl.find(h => h.messageId === mid);
    setView('inbox');
    if (!S.items.find(x => x.id === mid)) S.items.unshift({ id: mid, subject: g.subject, from: g.sender, email: '', date: g.createdAt, unread: false });
    renderList(); openMsg(mid);
  });
}

/* ---------- Settings ---------- */
function renderSettings() {
  const st = S.settings || { autoClean: true, cleanDays: 5, scanHour: 7 };
  $('#setview').innerHTML = '<div class="wtop"><h2>Settings</h2></div><div class="wide"><p class="lead">How the reader looks after your mail.</p>' +
    '<div class="card"><div class="setrow"><div><h4>' + ico('trash') + 'Auto-cleanup</h4>' +
      '<p class="hint" style="margin:0">Every day, newsletters you have read that arrived more than ' + st.cleanDays + ' days ago are <b>deleted from Gmail permanently</b>. Anything you saved, tagged, highlighted or starred in Gmail is kept.</p></div>' +
      '<button class="switch' + (st.autoClean ? ' on' : '') + '" id="acsw" role="switch" aria-checked="' + !!st.autoClean + '" aria-label="Auto-cleanup"></button></div>' +
      '<div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn" id="prevbtn">Preview what would be deleted</button></div>' +
      '<div class="preview" id="preview"></div></div>' +
    '<div class="card"><h4>' + ico('refresh') + 'Daily scan</h4><p class="hint">Runs every day at ' + st.scanHour + ':00 IST. It files new issues from your added senders and lists new senders for you to review.</p>' +
      '<button class="btn scanbtn">Check now</button></div>' +
    '<div class="card"><h4>' + ico('sparkle') + 'Readwell app <span class="badge">Beta</span></h4><p class="hint">The installable Readwell app connects to this backend with a private key. Keep it secret: anyone with the key and your API link can read your newsletters.</p>' +
      '<div class="row" style="justify-content:flex-start"><button class="btn" id="keybtn">Show my app key</button><button class="btn" id="rotbtn">Make a new key</button></div>' +
      '<div class="preview" id="keybox"></div></div>' +
    '<div class="card"><div class="setrow"><div><h4>' + ico('panel') + 'Larger buttons</h4><p class="hint" style="margin:0">Bigger buttons, icons and list text for touch. Just this device.</p></div>' +
      '<button class="switch' + (uiLarge() ? ' on' : '') + '" id="uisw" role="switch" aria-checked="' + uiLarge() + '" aria-label="Larger buttons"></button></div></div>' +
    '<div class="card"><h4>' + ico('book') + 'Your data</h4><p class="hint">Tags, highlights and sender decisions live in a Google Sheet in your Drive. The newsletters stay in Gmail.</p>' +
      '<div class="row" style="justify-content:flex-start">' + (st.sheetUrl ? '<a class="btn" href="' + esc(st.sheetUrl) + '" target="_blank" rel="noopener">Open data sheet</a>' : '') +
      '<button class="btn" id="clearbtn">Clear this device\'s cache</button></div></div></div>';
  $('#uisw').onclick = () => { const on = !uiLarge(); setUiLarge(on); $('#uisw').classList.toggle('on', on); $('#uisw').setAttribute('aria-checked', on); };
  $('#acsw').onclick = () => {
    const on = !$('#acsw').classList.contains('on');
    $('#acsw').classList.toggle('on', on); $('#acsw').setAttribute('aria-checked', on);
    S.settings = Object.assign({}, st, { autoClean: on });
    toast(on ? 'Auto-cleanup on' : 'Auto-cleanup off');
    bg('setAutoClean', on);
  };
  $('#prevbtn').onclick = async () => {
    const p = $('#preview'); p.style.display = 'block'; p.innerHTML = 'Checking…';
    let r; try { r = await run('cleanupPreview'); } catch (e) { p.style.display = 'none'; return; }
    if (!r.count) { p.innerHTML = 'Nothing to clean up right now.'; return; }
    p.innerHTML = '<b>' + plural(r.count, 'newsletter') + '</b> would be deleted:<ul>' +
      r.sample.map(x => '<li>' + esc(x.from) + ': ' + esc(x.subject) + '</li>').join('') + (r.count > r.sample.length ? '<li>and ' + (r.count - r.sample.length) + ' more</li>' : '') +
      '</ul><button class="btn danger" id="cleannow">Delete these now</button>';
    $('#cleannow').onclick = async () => {
      const ok = await confirmBox('Delete ' + plural(r.count, 'newsletter') + ' forever?', 'They will be permanently deleted from Gmail. This cannot be undone.', 'Delete forever');
      if (!ok) return;
      p.innerHTML = 'Deleting…';
      try { const n = await run('cleanupNow'); p.innerHTML = 'Deleted ' + plural(n, 'newsletter') + '.'; toast('Deleted ' + plural(n, 'newsletter')); cacheSet('inbox', null); }
      catch (e) { p.style.display = 'none'; }
    };
  };
  const showKey = k => {
    const b = $('#keybox'); b.style.display = 'block';
    b.innerHTML = '<div style="font-family:ui-monospace,Menlo,monospace;word-break:break-all;user-select:all;color:var(--ink)">' + esc(k) + '</div><div class="hint" style="margin:8px 0 0">Tap the key to select it, then copy.</div>';
  };
  $('#keybtn').onclick = async () => { try { const r = await run('getApiAccess'); showKey(r.key); } catch (e) {} };
  $('#rotbtn').onclick = async () => {
    const ok = await confirmBox('Make a new key?', 'The old key stops working right away. Any device using it will need the new one.', 'Make new key');
    if (!ok) return;
    try { const k = await run('rotateApiKey'); showKey(k); toast('New key made'); } catch (e) {}
  };
  $('#clearbtn').onclick = () => {
    try { Object.keys(localStorage).filter(k => k.indexOf('nr_') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    toast('Cache cleared. Reloading…');
    setTimeout(() => location.reload(), 600);
  };
}

/* ---------- Start: instant from this browser, then refresh quietly ---------- */
(function start() {
  const cachedState = cacheGet('state');
  if (cachedState) applyState(cachedState);
  const cached = cacheGet('inbox');
  if (cached) { S.items = cached; renderList(); }
  run('bootstrap').then(r => {
    applyState(r.state); saveState();
    if (S.view === 'inbox' && !S.mode) {
      S.items = r.list.items; S.more = r.list.more; S.start = 40;
      cacheSet('inbox', S.items);
      renderList();
      if (S.cur) {                                   // opened something before startup finished
        renderSide();
        const doc = frame.contentDocument;
        if (doc && doc.__nr) (S.hls[S.cur.id] || []).forEach(h => {
          if (!doc.querySelector('mark[data-id="' + h.id + '"]')) markSaved(doc, h);
        });
      }
    }
    prefetch();
  }).catch(() => {});
})();
</script>
